AWSTemplateFormatVersion: '2010-09-09'
Description: Creates an S3 bucket, Cloudfront to host IDMC website components

Parameters:
  Env:
    Type: String
    Description: 'The environment name your service, job, or workflow is being deployed to.'
    AllowedValues:
      - preview
      - release
  HostedZoneId:
    Description: 'The Route 53 hosted zone ID to create the domain in.'
    Type: AWS::Route53::HostedZone::Id

Mappings:
  EnvMaps:
    preview:
      Domain: preview-website-components.idmcdb.org
      BucketName: idmc-website-components-preview
      PolicyName: idmc-website-components-preview-s3-bucket-update-policy
      UpdateIamUserName: idmc-website-components-preview-s3-bucket-update-user
    release:
      Domain: release-website-components.idmcdb.org
      BucketName: idmc-website-components-release
      PolicyName: idmc-website-components-release-s3-bucket-update-policy
      UpdateIamUserName: idmc-website-components-release-s3-bucket-update-user

Resources:
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !FindInMap [EnvMaps, !Ref Env, BucketName]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref 'WebsiteBucket'
      PolicyDocument:
        Statement:
        - Sid: PublicReadForGetBucketObjects
          Effect: Allow
          Principal: '*'
          Action: s3:GetObject
          Resource: !Join ['', ['arn:aws:s3:::', !Ref 'WebsiteBucket', /*]]

  AcmCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !FindInMap [EnvMaps, !Ref Env, Domain]
      DomainValidationOptions:
        - DomainName: !FindInMap [EnvMaps, !Ref Env, Domain]
          HostedZoneId: !Ref 'HostedZoneId'
      ValidationMethod: DNS

  # The TTLs on the cache behaviours govern only what CloudFront holds. A browser
  # gets whatever `Cache-Control` the origin sent, and the S3 website endpoint sends
  # none unless every upload carries the metadata -- which would put the rule in the
  # deploy script rather than here. These set the header at the edge instead.
  ImmutableResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub
          - 'idmc-website-components-${EnvName}-immutable'
          - EnvName: !Ref Env
        Comment: 'Contenthash-named assets: safe to hold indefinitely'
        CustomHeadersConfig:
          Items:
          - Header: Cache-Control
            Value: 'public, max-age=31536000, immutable'
            Override: true

  RevalidateResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub
          - 'idmc-website-components-${EnvName}-revalidate'
          - EnvName: !Ref Env
        Comment: 'Unhashed entry points: must be rechecked before reuse'
        CustomHeadersConfig:
          Items:
          - Header: Cache-Control
            Value: 'no-cache'
            Override: true

  WebsiteCloudfront:
    Type: AWS::CloudFront::Distribution
    DependsOn:
    - WebsiteBucket
    Properties:
      DistributionConfig:
        Comment: Cloudfront Distribution pointing to S3 bucket
        Origins:
        - DomainName: !Select [2, !Split ["/", !GetAtt WebsiteBucket.WebsiteURL]]
          Id: S3Origin
          CustomOriginConfig:
            HTTPPort: '80'
            HTTPSPort: '443'
            OriginProtocolPolicy: http-only
        Enabled: true
        HttpVersion: 'http2'
        DefaultRootObject: index.html
        Aliases:
        - !FindInMap [EnvMaps, !Ref Env, Domain]
        # `js/main.bundle.js` and `css/main.css` are unhashed -- the embed snippets
        # link them by hand -- and they reference chunks whose names carry a
        # contenthash. A viewer holding a previous deployment's entry therefore asks
        # for chunk names the bucket no longer has, and the SPA ErrorDocument answers
        # a missing .js with index.html, so the failure surfaces as a parse error. The
        # entry must revalidate on every request; only the hashed names may be held.
        DefaultCacheBehavior:
          AllowedMethods:
          - GET
          - HEAD
          Compress: true
          TargetOriginId: S3Origin
          ForwardedValues:
            QueryString: true
            Cookies:
              Forward: none
          ViewerProtocolPolicy: redirect-to-https
          MinTTL: 0
          DefaultTTL: 0
          MaxTTL: 31536000
          ResponseHeadersPolicyId: !Ref RevalidateResponseHeadersPolicy
        # Evaluated in order, first match wins. `css/main.css` has to precede the
        # `css/*.css` pattern: the CSS chunk names are `<id>.<contenthash>.css`, which
        # no suffix distinguishes from the unhashed entry.
        CacheBehaviors:
        - PathPattern: 'css/main.css'
          AllowedMethods:
          - GET
          - HEAD
          Compress: true
          TargetOriginId: S3Origin
          ForwardedValues:
            QueryString: true
            Cookies:
              Forward: none
          ViewerProtocolPolicy: redirect-to-https
          MinTTL: 0
          DefaultTTL: 0
          MaxTTL: 31536000
          ResponseHeadersPolicyId: !Ref RevalidateResponseHeadersPolicy
        - PathPattern: 'js/*.chunk.js'
          AllowedMethods:
          - GET
          - HEAD
          Compress: true
          TargetOriginId: S3Origin
          # A contenthash already distinguishes every revision, so a query string
          # would only fragment the cache.
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          ViewerProtocolPolicy: redirect-to-https
          MinTTL: 31536000
          DefaultTTL: 31536000
          MaxTTL: 31536000
          ResponseHeadersPolicyId: !Ref ImmutableResponseHeadersPolicy
        - PathPattern: 'css/*.css'
          AllowedMethods:
          - GET
          - HEAD
          Compress: true
          TargetOriginId: S3Origin
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          ViewerProtocolPolicy: redirect-to-https
          MinTTL: 31536000
          DefaultTTL: 31536000
          MaxTTL: 31536000
          ResponseHeadersPolicyId: !Ref ImmutableResponseHeadersPolicy
        - PathPattern: 'assets/*'
          AllowedMethods:
          - GET
          - HEAD
          Compress: true
          TargetOriginId: S3Origin
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          ViewerProtocolPolicy: redirect-to-https
          MinTTL: 31536000
          DefaultTTL: 31536000
          MaxTTL: 31536000
          ResponseHeadersPolicyId: !Ref ImmutableResponseHeadersPolicy
        PriceClass: PriceClass_All
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificate
          SslSupportMethod: sni-only

  DNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref 'HostedZoneId'
      Comment: CNAME redirect custom name to CloudFront distribution
      Name: !FindInMap [EnvMaps, !Ref Env, Domain]
      Type: CNAME
      TTL: '900'
      ResourceRecords:
      - !GetAtt [WebsiteCloudfront, DomainName]

  ClientUpdateIamPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !FindInMap [EnvMaps, !Ref Env, PolicyName]
      Description: Policy for to update static files and invalidate CloudFront cache
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action:
              - cloudfront:CreateInvalidation
            Effect: Allow
            Resource:
              - !Join ['', [!Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/', !Ref 'WebsiteCloudfront']]
          - Action:
              - s3:DeleteObject
              - s3:GetBucketLocation
              - s3:GetObject
              - s3:ListBucket
              - s3:PutObject
              - s3:PutObjectAcl
            Effect: Allow
            Resource:
              - !Join ['', ['arn:aws:s3:::', !Ref 'WebsiteBucket']]
              - !Join ['', ['arn:aws:s3:::', !Ref 'WebsiteBucket', /*]]

  ClientUpdateIamUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !FindInMap [EnvMaps, !Ref Env, UpdateIamUserName]
      ManagedPolicyArns:
        - !Ref ClientUpdateIamPolicy

Outputs:
  BucketName:
    Value: !Ref 'WebsiteBucket'
    Description: Name of S3 bucket to hold website content
  CloudfrontEndpoint:
    Value: !GetAtt [WebsiteCloudfront, DomainName]
    Description: Endpoint for Cloudfront distribution
  CloudfrontDistributionId:
    Value: !Ref 'WebsiteCloudfront'
    Description: ID for Cloudfront distribution
  DNSRecord:
    Value: !Ref DNSRecord
    Description: Custom DNS Record
  PolicyName:
    Description: Policy to be used to update client files
    Value: !FindInMap [EnvMaps, !Ref Env, PolicyName]
  MaintainerUser:
    Description: User used to deploy new updates.
    Value: !FindInMap [EnvMaps, !Ref Env, UpdateIamUserName]
