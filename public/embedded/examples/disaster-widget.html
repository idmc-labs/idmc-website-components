<!DOCTYPE html>
<html lang="en" translate="no">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Embedded: Disaster Widget</title>
        <!--
            NOTE: Asset references differ between development and production builds.
            In a production build, component styles are extracted into /css/main.css
            and the webpack runtime is split into /js/runtime.bundle.js (which must load
            before main.bundle.js below). In development both are inlined into
            main.bundle.js (styles injected by style-loader), so /css/main.css and
            /js/runtime.bundle.js do not exist and will 404 harmlessly.

            NOTE: these examples are served by the app itself, so they can reference
            the bundle at the site root. A real embedding page is on another origin
            and must give all three URLs that origin:

                <link rel="stylesheet" href="https://<this-deployment>/css/main.css" />
                <script src="https://<this-deployment>/js/runtime.bundle.js"></script>
                <script src="https://<this-deployment>/js/main.bundle.js"></script>

            The rest of the assets -- the per-page chunks, their stylesheets and the
            images -- are fetched by the runtime, which resolves them against
            REACT_APP_ASSET_BASE_URL, then against the src of the main.bundle.js tag.
            An embedder whose page rewrites or concatenates script tags leaves neither
            usable, and must instead declare the origin before the bundle loads:

                <script>window.idmcComponentsBaseUrl = 'https://<this-deployment>/';</script>
        -->
        <link rel="stylesheet" href="./base.css" />
        <link rel="stylesheet" href="/css/main.css" />
        <style>
            :root { --embed-min-height: 400px; }
        </style>
        <script>
            window.page = 'disaster-widget';
            window.iso3 = 'AFG';
        </script>
    </head>
    <body>
        <div id="app-container">
            <div class="embed-loading">Loading...</div>
        </div>
        <script type="text/javascript" src="/js/runtime.bundle.js"></script>
        <script type="text/javascript" src="/js/main.bundle.js"></script>
    </body>
</html>
