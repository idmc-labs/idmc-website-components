name: ${COMPOSE_PROJECT_NAME:-idmc-website-components}

services:
  web-app-serve:
    build:
      context: ../
      target: web-app-serve
    environment:
      # web-app-serve config: dumps unreplaced placeholders + diffs at /__debug/
      # (the image already disables biome pre-formatting, see the Dockerfile)
      APPLY_CONFIG__ENABLE_DEBUG: "true"
      # Every variable the app reads, with a local default; override any of them
      # through an optional local .env. The image bakes no defaults, so this list
      # is also the set a real deployment has to supply.
      REACT_APP_ENVIRONMENT: "${REACT_APP_ENVIRONMENT:-dev}"
      REACT_APP_DATA_RELEASE: "${REACT_APP_DATA_RELEASE:-RELEASE}"
      REACT_APP_HELIX_GRAPHQL_ENDPOINT: "${REACT_APP_HELIX_GRAPHQL_ENDPOINT:-https://helix-tools-api.idmcdb.org/graphql}"
      REACT_APP_HELIX_REST_ENDPOINT: "${REACT_APP_HELIX_REST_ENDPOINT:-https://helix-tools-api.idmcdb.org/external-api/}"
      REACT_APP_HELIX_CLIENT_ID: "${REACT_APP_HELIX_CLIENT_ID:-IDMCWSHSOLO009}"
      REACT_APP_GIDD_GRAPHQL_ENDPOINT: "${REACT_APP_GIDD_GRAPHQL_ENDPOINT:-https://website-api.idmcdb.org/graphql/}"
      REACT_APP_DRUPAL_ENDPOINT: "${REACT_APP_DRUPAL_ENDPOINT:-https://www.internal-displacement.org}"
      REACT_APP_DRUPAL_REST_ENDPOINT: "${REACT_APP_DRUPAL_REST_ENDPOINT:-https://api.internal-displacement.org}"
      REACT_APP_MAPBOX_STYLE: "${REACT_APP_MAPBOX_STYLE:-mapbox://styles/togglecorp/cl50rwy0a002d14mo6w9zprio}"
      REACT_APP_MAPBOX_ACCESS_TOKEN: "${REACT_APP_MAPBOX_ACCESS_TOKEN:-pk.eyJ1IjoidG9nZ2xlY29ycCIsImEiOiJjazk5ZXMza2YxZmQ1M2dvNWxneTEycnQwIn0.K3u-ns63rFzM7CzrnOBm2w}"
      REACT_APP_HCAPTCHA_SITEKEY: "${REACT_APP_HCAPTCHA_SITEKEY:-fb0493e0-e1ce-4ee6-946c-43267d969ba2}"
      # Left empty so a local run reports nothing to the shared GA/Sentry projects.
      REACT_APP_GA_TRACKING_ID: "${REACT_APP_GA_TRACKING_ID:-}"
      REACT_APP_SENTRY_DSN: "${REACT_APP_SENTRY_DSN:-}"
    env_file:
      - path: .env
        required: false
    ports:
      - '8050:80'
